name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 7.6.4
      - run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: lowend-renderer-jar
          path: build/libs/*.jar

  sources:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 7.6.4
      - run: gradle genSources --stacktrace
      - name: Collect Minecraft sources
        run: |
          mkdir -p mc-sources
          find "$HOME/.gradle" . -type f -name 'minecraft*sources*.jar' -exec cp {} mc-sources/ \; 2>/dev/null || true
          ls -la mc-sources
      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-sources
          path: mc-sources/*.jar
